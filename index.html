<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura als Països Baixos 🇳🇱✈️</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-sky: #E0F7FA;
            --color-orange: #FF9800;
            --color-blue: #03A9F4;
            --color-green: #4CAF50;
            --color-purple: #9C27B0;
            --color-red: #FF5252;
            --text-color: #37474F;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--color-sky);
            background-image: radial-gradient(#B3E5FC 20%, transparent 20%), radial-gradient(#B3E5FC 20%, transparent 20%);
            background-position: 0 0, 50px 50px;
            background-size: 100px 100px;
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* ==========================================
           PANTALLA COMPLETA DE CEL
           ========================================== */
        .cel-portada {
            height: 100vh;
            width: 100%;
            background: linear-gradient(180deg, #4FC3F7 0%, #81D4FA 60%, #B3E5FC 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        .titol-portada {
            z-index: 10;
            animation: rebotar-titol 2s infinite ease-in-out;
            margin-bottom: 20vh; /* Pujem el títol perquè no el tapin els núvols grans */
        }

        .cel-portada h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 4.5rem;
            margin: 0;
            color: white;
            text-shadow: 4px 4px 0px #0277BD;
            letter-spacing: 2px;
        }

        .cel-portada p {
            font-size: 1.6rem;
            color: #01579B;
            font-weight: 800;
            margin-top: 10px;
            background: rgba(255,255,255,0.6);
            padding: 5px 20px;
            border-radius: 20px;
        }

        @keyframes rebotar-titol {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* AVIONS */
        .avio-wrapper {
            position: absolute;
            z-index: 5;
            transition: transform 1.5s cubic-bezier(0.5, 0, 0.75, 0), opacity 1s ease;
        }
        
        .avio-inner {
            font-size: 3.5rem;
            filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.1));
        }
        
        .avio-1 { top: 10%; left: -150px; }
        .avio-2 { top: 25%; left: -150px; }
        .avio-3 { top: 15%; right: -150px; }

        .avio-1 .avio-inner { animation: creuar-dreta 8s infinite linear; transform: rotate(-5deg); }
        .avio-2 .avio-inner { animation: creuar-dreta 12s infinite linear; animation-delay: 2s; transform: rotate(-5deg); font-size: 2.5rem; }
        .avio-3 .avio-inner { animation: creuar-esquerra 10s infinite linear; transform: scaleX(-1) rotate(-5deg); font-size: 4rem; }

        @keyframes creuar-dreta {
            from { transform: translateX(0) rotate(-5deg); }
            to { transform: translateX(120vw) rotate(-5deg); }
        }
        @keyframes creuar-esquerra {
            from { transform: translateX(0) scaleX(-1) rotate(-5deg); }
            to { transform: translateX(-120vw) scaleX(-1) rotate(-5deg); }
        }

        /* NÚVOLS REALISTES, FOSCS I MOLT GRANS */
        .nube {
            position: absolute;
            bottom: -60px; /* Posicionats a la part de baix */
            z-index: 2;
            filter: drop-shadow(0 -10px 30px rgba(0, 0, 0, 0.2)); /* Ombra forta per donar volum */
            transition: transform 1.5s cubic-bezier(0.5, 0, 0.75, 0), opacity 1s ease;
        }

        .nube svg {
            width: 100%;
            height: auto;
        }

        /* Mides exagerades perquè siguin "molt grans" */
        .nube-1 { left: -200px; width: 800px; bottom: -100px; }
        .nube-2 { left: 30%; width: 700px; bottom: -150px; }
        .nube-3 { right: -200px; width: 900px; bottom: -80px; }

        .nube-inner {
            animation: flotar 4s infinite ease-in-out;
        }
        .nube-2 .nube-inner { animation-duration: 5s; animation-direction: reverse; }
        .nube-3 .nube-inner { animation-duration: 6s; }

        @keyframes flotar {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* FLETXA DE BAIXAR */
        .fletxa-baixar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            font-size: 3rem;
            color: white;
            z-index: 20;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transform: translateX(-50%);
            animation: baixar 1.5s infinite ease-in-out;
            transition: transform 1.5s ease, opacity 1s ease;
        }

        @keyframes baixar {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(15px); }
        }

        /* CLASSE PER FER VOLAR ELS NÚVOLS I AVIONS CAP AMUNT AL FER SCROLL */
        body.scrolled .nube,
        body.scrolled .avio-wrapper,
        body.scrolled .fletxa-baixar {
            transform: translateY(-130vh) !important;
            opacity: 0;
        }
        
        body.scrolled .fletxa-baixar {
            animation: none;
        }

        /* ==========================================
           CONTINGUT PRINCIPAL (DIES)
           ========================================== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 20;
            background: var(--color-sky);
        }

        /* BOTONS GIGANTS */
        .botones-dias {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn-gigante {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 25px 20px;
            border: none;
            border-radius: 25px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
        }

        .btn-gigante:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }

        .btn-1 { background-color: var(--color-orange); box-shadow: 0 6px 0 #E65100; }
        .btn-2 { background-color: var(--color-green); box-shadow: 0 6px 0 #1B5E20; }
        .btn-3 { background-color: var(--color-purple); box-shadow: 0 6px 0 #4A148C; }
        .btn-4 { background-color: var(--color-red); box-shadow: 0 6px 0 #B71C1C; }

        /* TARGETES DE CONTINGUT */
        .dia-contenido {
            background: white;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px dashed #B3E5FC;
            scroll-margin-top: 20px;
        }

        .dia-contenido h2 {
            font-family: 'Baloo 2', cursive;
            color: var(--color-blue);
            font-size: 2rem;
            margin-top: 0;
            text-align: center;
            border-bottom: 3px dotted #B3E5FC;
            padding-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-family: 'Baloo 2', cursive;
            color: #0288D1;
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .cel-portada h1 { font-size: 3rem; }
            .avio-inner { font-size: 2.5rem; }
            .btn-gigante { font-size: 1.4rem; padding: 20px 15px; }
            .nube-1 { width: 500px; left: -150px; }
            .nube-2 { width: 450px; left: 10%; }
            .nube-3 { width: 550px; right: -150px; }
        }
    </style>
</head>
<body>

    <!-- PANTALLA COMPLETA DE CEL -->
    <header class="cel-portada">
        
        <!-- Avions -->
        <div class="avio-wrapper avio-1"><div class="avio-inner">✈️</div></div>
        <div class="avio-wrapper avio-2"><div class="avio-inner">🛩️</div></div>
        <div class="avio-wrapper avio-3"><div class="avio-inner">✈️</div></div>

        <!-- Núvols grans i foscos -->
        <div class="nube nube-1">
            <div class="nube-inner">
                <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Degradat de gris fosc a blanc trencat -->
                        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#eceff1"/>
                            <stop offset="60%" stop-color="#90a4ae"/>
                            <stop offset="100%" stop-color="#455a64"/>
                        </linearGradient>
                        <filter id="blur1"><feGaussianBlur stdDeviation="4" /></filter>
                    </defs>
                    <g filter="url(#blur1)">
                        <circle cx="100" cy="150" r="70" fill="url(#g1)"/>
                        <circle cx="200" cy="110" r="90" fill="url(#g1)"/>
                        <circle cx="300" cy="140" r="80" fill="url(#g1)"/>
                        <rect x="80" y="140" width="250" height="70" rx="35" fill="url(#g1)"/>
                    </g>
                </svg>
            </div>
        </div>

        <div class="nube nube-2">
            <div class="nube-inner">
                <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#eceff1"/>
                            <stop offset="60%" stop-color="#90a4ae"/>
                            <stop offset="100%" stop-color="#455a64"/>
                        </linearGradient>
                        <filter id="blur2"><feGaussianBlur stdDeviation="4" /></filter>
                    </defs>
                    <g filter="url(#blur2)">
                        <circle cx="120" cy="140" r="80" fill="url(#g2)"/>
                        <circle cx="220" cy="100" r="100" fill="url(#g2)"/>
                        <circle cx="320" cy="150" r="70" fill="url(#g2)"/>
                        <rect x="100" y="130" width="260" height="80" rx="40" fill="url(#g2)"/>
                    </g>
                </svg>
            </div>
        </div>

        <div class="nube nube-3">
            <div class="nube-inner">
                <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#eceff1"/>
                            <stop offset="60%" stop-color="#90a4ae"/>
                            <stop offset="100%" stop-color="#455a64"/>
                        </linearGradient>
                        <filter id="blur3"><feGaussianBlur stdDeviation="4" /></filter>
                    </defs>
                    <g filter="url(#blur3)">
                        <circle cx="80" cy="160" r="60" fill="url(#g3)"/>
                        <circle cx="180" cy="120" r="85" fill="url(#g3)"/>
                        <circle cx="280" cy="150" r="75" fill="url(#g3)"/>
                        <rect x="60" y="150" width="260" height="60" rx="30" fill="url(#g3)"/>
                    </g>
                </svg>
            </div>
        </div>

        <div class="titol-portada">
            <h1>Països Baixos</h1>
            <p>La nostra gran aventura!</p>
        </div>

        <div class="fletxa-baixar">⬇️</div>
    </header>

    <div class="container">

        <!-- BOTONS GIGANTS PER SALTAR RÀPID -->
        <div class="botones-dias">
            <a href="#dia-1" class="btn-gigante btn-1">🧳 DIA 1: Ja marxem!</a>
            <a href="#dia-2" class="btn-gigante btn-2">🚲 DIA 2</a>
            <a href="#dia-3" class="btn-gigante btn-3">🌷 DIA 3</a>
            <a href="#dia-4" class="btn-gigante btn-4">🏠 DIA 4: Tornada a casa</a>
        </div>

        <!-- ================= CONTINGUT DIA 1 (TOTALMENT BUIT) ================= -->
        <div id="dia-1" class="dia-contenido">
            <h2>🧳 DIA 1: Ja marxem!</h2>
            <!-- Aqui anirà el text quan me'l passis -->
        </div>

        <!-- ================= CONTINGUT DIES PENDENTS ================= -->
        <div id="dia-2" class="dia-contenido">
            <h2>🚲 DIA 2: ¡A pedalejar!</h2>
        </div>

        <div id="dia-3" class="dia-contenido">
            <h2>🌷 DIA 3: Museu i Parcs</h2>
        </div>

        <div id="dia-4" class="dia-contenido">
            <h2>✈️ DIA 4: Tornada a casa</h2>
        </div>

    </div>

    <footer>
        ¡Bon viatge als Països Baixos! 🇳🇱✈️
    </footer>

    <!-- JAVASCRIPT PER L'ANIMACIÓ CAP AMUNT AL FER SCROLL -->
    <script>
        window.addEventListener('scroll', function() {
            if (window.scrollY > 50) {
                document.body.classList.add('scrolled');
            } else {
                document.body.classList.remove('scrolled');
            }
        }, { passive: true });
    </script>

</body>
</html>
