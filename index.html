<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura als Països Baixos 🇳🇱✈️</title>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-sky: #E0F7FA;
            --color-orange: #FF9800;
            --color-blue: #03A9F4;
            --color-green: #4CAF50;
            --color-purple: #9C27B0;
            --color-red: #FF5252;
            --text-color: #37474F;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            color: var(--text-color);
            line-height: 1.6;
        }

        /* BLOQUEIG DE SCROLL INICIAL */
        body {
            overflow: hidden; /* No es pot fer scroll */
            height: 100vh;
            background-color: var(--color-sky);
            background-image: radial-gradient(#B3E5FC 20%, transparent 20%), radial-gradient(#B3E5FC 20%, transparent 20%);
            background-position: 0 0, 50px 50px;
            background-size: 100px 100px;
            transition: height 0s;
        }

        body.unlocked {
            overflow-y: auto; /* Es desbloqueja després de l'animació */
            height: auto;
        }

        html {
            scroll-behavior: smooth;
        }

        /* ==========================================
           PANTALLA COMPLETA DE CEL
           ========================================== */
        .cel-portada {
            height: 100vh;
            width: 100%;
            background: linear-gradient(180deg, #4FC3F7 0%, #81D4FA 60%, #B3E5FC 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 1;
        }

        .titol-portada {
            z-index: 10;
            animation: rebotar-titol 2s infinite ease-in-out;
            margin-bottom: 15vh;
        }

        .cel-portada h1 {
            font-family: 'Baloo 2', cursive;
            font-size: 4.5rem;
            margin: 0;
            color: white;
            text-shadow: 4px 4px 0px #0277BD;
            letter-spacing: 2px;
        }

        .cel-portada p {
            font-size: 1.6rem;
            color: #01579B;
            font-weight: 800;
            margin-top: 10px;
            background: rgba(255,255,255,0.6);
            padding: 5px 20px;
            border-radius: 20px;
        }

        @keyframes rebotar-titol {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        /* AVIONS 3D ESTÀTICS TIPUS CANVA */
        .avio-3d {
            position: absolute;
            z-index: 5;
            filter: drop-shadow(8px 8px 15px rgba(0,0,0,0.3));
            transform: perspective(1000px) rotateY(-20deg) rotateX(5deg) rotateZ(-10deg);
        }

        .avio-1 { top: 15%; left: 10%; width: 220px; }
        .avio-2 { top: 25%; right: 5%; width: 180px; transform: perspective(1000px) rotateY(20deg) rotateX(5deg) rotateZ(10deg) scaleX(-1); }
        .avio-3 { top: 50%; left: 40%; width: 150px; transform: perspective(1000px) rotateY(-15deg) rotateX(10deg) rotateZ(-5deg); }

        /* NÚVOLS REALISTES, FOSCS, MOLT GRANS I AMAGATS INICIALMENT */
        .nube {
            position: absolute;
            bottom: -150px; /* Amagats sota la pantalla */
            z-index: 2;
            filter: drop-shadow(0 -10px 30px rgba(0, 0, 0, 0.2));
            opacity: 0;
        }

        .nube svg {
            width: 100%;
            height: auto;
        }

        .nube-1 { left: -200px; width: 800px; }
        .nube-2 { left: 30%; width: 700px; }
        .nube-3 { right: -200px; width: 900px; }

        /* ANIMACIÓ AUTOMÀTICA DELS NÚVOLS */
        body.loaded .nube {
            animation: pujar-i-desapareixer 3s cubic-bezier(0.5, 0, 0.75, 0) forwards;
        }
        
        body.loaded .nube-1 { animation-delay: 0.2s; }
        body.loaded .nube-2 { animation-delay: 0s; }
        body.loaded .nube-3 { animation-delay: 0.4s; }

        @keyframes pujar-i-desapareixer {
            0% { transform: translateY(0); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(-130vh); opacity: 0; }
        }

        /* FLETXA DE BAIXAR (AMAGADA FINS QUE ACABI L'ANIMACIÓ) */
        .fletxa-baixar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            font-size: 3rem;
            color: white;
            z-index: 20;
            text-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
        }

        body.unlocked .fletxa-baixar {
            animation: mostrar-fletxa 1s ease forwards, baixar 1.5s 1s infinite ease-in-out;
        }

        @keyframes mostrar-fletxa {
            to { opacity: 1; pointer-events: auto; }
        }

        @keyframes baixar {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(15px); }
        }

        /* ==========================================
           CONTINGUT PRINCIPAL (DIES)
           ========================================== */
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 20;
            background: var(--color-sky);
        }

        /* BOTONS GIGANTS */
        .botones-dias {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 40px;
        }

        .btn-gigante {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            width: 100%;
            padding: 25px 20px;
            border: none;
            border-radius: 25px;
            font-family: 'Baloo 2', cursive;
            font-size: 1.8rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 6px 0px rgba(0,0,0,0.2);
        }

        .btn-gigante:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0px rgba(0,0,0,0.2);
        }

        .btn-1 { background-color: var(--color-orange); box-shadow: 0 6px 0 #E65100; }
        .btn-2 { background-color: var(--color-green); box-shadow: 0 6px 0 #1B5E20; }
        .btn-3 { background-color: var(--color-purple); box-shadow: 0 6px 0 #4A148C; }
        .btn-4 { background-color: var(--color-red); box-shadow: 0 6px 0 #B71C1C; }

        /* TARGETES DE CONTINGUT */
        .dia-contenido {
            background: white;
            border-radius: 30px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px dashed #B3E5FC;
            scroll-margin-top: 20px;
        }

        .dia-contenido h2 {
            font-family: 'Baloo 2', cursive;
            color: var(--color-blue);
            font-size: 2rem;
            margin-top: 0;
            text-align: center;
            border-bottom: 3px dotted #B3E5FC;
            padding-bottom: 15px;
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-family: 'Baloo 2', cursive;
            color: #0288D1;
            font-size: 1.2rem;
        }

        @media (max-width: 600px) {
            .cel-portada h1 { font-size: 3rem; }
            .avio-1 { width: 140px; top: 10%; left: 5%; }
            .avio-2 { width: 110px; right: 5%; }
            .avio-3 { width: 90px; top: 45%; left: 30%; }
            .btn-gigante { font-size: 1.4rem; padding: 20px 15px; }
            .nube-1 { width: 500px; left: -150px; }
            .nube-2 { width: 450px; left: 10%; }
            .nube-3 { width: 550px; right: -150px; }
        }
    </style>
</head>
<body>

    <!-- PANTALLA COMPLETA DE CEL -->
    <header class="cel-portada">
        
        <!-- Avions 3D Estàtics (SVG amb degradats) -->
        <div class="avio-3d avio-1">
            <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="cos1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#cfd8dc"/>
                    </linearGradient>
                    <linearGradient id="ala1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#e53935"/>
                        <stop offset="100%" stop-color="#b71c1c"/>
                    </linearGradient>
                </defs>
                <!-- Cos -->
                <path d="M20,50 L150,30 L190,45 L190,55 L150,70 Z" fill="url(#cos1)" />
                <!-- Cua -->
                <path d="M20,50 L40,20 L60,45 Z" fill="url(#cos1)" />
                <!-- Aleta superior -->
                <path d="M150,30 L160,10 L170,30 Z" fill="url(#ala1)" />
                <!-- Ala inferior -->
                <path d="M70,55 L110,90 L140,60 Z" fill="url(#ala1)" />
                <!-- Finestra -->
                <circle cx="160" cy="45" r="4" fill="#0288d1" />
            </svg>
        </div>

        <div class="avio-3d avio-2">
            <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="cos2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#cfd8dc"/>
                    </linearGradient>
                    <linearGradient id="ala2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#1e88e5"/>
                        <stop offset="100%" stop-color="#0d47a1"/>
                    </linearGradient>
                </defs>
                <path d="M20,50 L150,30 L190,45 L190,55 L150,70 Z" fill="url(#cos2)" />
                <path d="M20,50 L40,20 L60,45 Z" fill="url(#cos2)" />
                <path d="M150,30 L160,10 L170,30 Z" fill="url(#ala2)" />
                <path d="M70,55 L110,90 L140,60 Z" fill="url(#ala2)" />
                <circle cx="160" cy="45" r="4" fill="#ffeb3b" />
            </svg>
        </div>

        <div class="avio-3d avio-3">
            <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="cos3" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="100%" stop-color="#cfd8dc"/>
                    </linearGradient>
                    <linearGradient id="ala3" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#ffca28"/>
                        <stop offset="100%" stop-color="#ff6f00"/>
                    </linearGradient>
                </defs>
                <path d="M20,50 L150,30 L190,45 L190,55 L150,70 Z" fill="url(#cos3)" />
                <path d="M20,50 L40,20 L60,45 Z" fill="url(#cos3)" />
                <path d="M150,30 L160,10 L170,30 Z" fill="url(#ala3)" />
                <path d="M70,55 L110,90 L140,60 Z" fill="url(#ala3)" />
                <circle cx="160" cy="45" r="4" fill="#4caf50" />
            </svg>
        </div>

        <!-- Núvols grans i foscos -->
        <div class="nube nube-1">
            <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#eceff1"/>
                        <stop offset="60%" stop-color="#90a4ae"/>
                        <stop offset="100%" stop-color="#455a64"/>
                    </linearGradient>
                    <filter id="blur1"><feGaussianBlur stdDeviation="4" /></filter>
                </defs>
                <g filter="url(#blur1)">
                    <circle cx="100" cy="150" r="70" fill="url(#g1)"/>
                    <circle cx="200" cy="110" r="90" fill="url(#g1)"/>
                    <circle cx="300" cy="140" r="80" fill="url(#g1)"/>
                    <rect x="80" y="140" width="250" height="70" rx="35" fill="url(#g1)"/>
                </g>
            </svg>
        </div>

        <div class="nube nube-2">
            <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#eceff1"/>
                        <stop offset="60%" stop-color="#90a4ae"/>
                        <stop offset="100%" stop-color="#455a64"/>
                    </linearGradient>
                    <filter id="blur2"><feGaussianBlur stdDeviation="4" /></filter>
                </defs>
                <g filter="url(#blur2)">
                    <circle cx="120" cy="140" r="80" fill="url(#g2)"/>
                    <circle cx="220" cy="100" r="100" fill="url(#g2)"/>
                    <circle cx="320" cy="150" r="70" fill="url(#g2)"/>
                    <rect x="100" y="130" width="260" height="80" rx="40" fill="url(#g2)"/>
                </g>
            </svg>
        </div>

        <div class="nube nube-3">
            <svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#eceff1"/>
                        <stop offset="60%" stop-color="#90a4ae"/>
                        <stop offset="100%" stop-color="#455a64"/>
                    </linearGradient>
                    <filter id="blur3"><feGaussianBlur stdDeviation="4" /></filter>
                </defs>
                <g filter="url(#blur3)">
                    <circle cx="80" cy="160" r="60" fill="url(#g3)"/>
                    <circle cx="180" cy="120" r="85" fill="url(#g3)"/>
                    <circle cx="280" cy="150" r="75" fill="url(#g3)"/>
                    <rect x="60" y="150" width="260" height="60" rx="30" fill="url(#g3)"/>
                </g>
            </svg>
        </div>

        <div class="titol-portada">
            <h1>Països Baixos</h1>
            <p>La nostra gran aventura!</p>
        </div>

        <div class="fletxa-baixar">⬇️</div>
    </header>

    <div class="container">

        <!-- BOTONS GIGANTS PER SALTAR RÀPID -->
        <div class="botones-dias">
            <a href="#dia-1" class="btn-gigante btn-1">🧳 DIA 1: Ja marxem!</a>
            <a href="#dia-2" class="btn-gigante btn-2">🚲 DIA 2</a>
            <a href="#dia-3" class="btn-gigante btn-3">🌷 DIA 3</a>
            <a href="#dia-4" class="btn-gigante btn-4">🏠 DIA 4: Tornada a casa</a>
        </div>

        <!-- ================= CONTINGUT DIA 1 (TOTALMENT BUIT) ================= -->
        <div id="dia-1" class="dia-contenido">
            <h2>🧳 DIA 1: Ja marxem!</h2>
            <!-- Aqui anirà el text quan me'l passis -->
        </div>

        <!-- ================= CONTINGUT DIES PENDENTS ================= -->
        <div id="dia-2" class="dia-contenido">
            <h2>🚲 DIA 2: ¡A pedalejar!</h2>
        </div>

        <div id="dia-3" class="dia-contenido">
            <h2>🌷 DIA 3: Museu i Parcs</h2>
        </div>

        <div id="dia-4" class="dia-contenido">
            <h2>✈️ DIA 4: Tornada a casa</h2>
        </div>

    </div>

    <footer>
        ¡Bon viatge als Països Baixos! 🇳🇱✈️
    </footer>

    <!-- JAVASCRIPT PER BLOQUEJAR I DESBLOQUEJAR EL SCROLL -->
    <script>
        window.onload = function() {
            // Activa l'animació dels núvols mig segon després de carregar
            setTimeout(function() {
                document.body.classList.add('loaded');
            }, 500);

            // Desbloqueja el scroll i mostra la fletxa quan acaba l'animació (3.5 segons)
            setTimeout(function() {
                document.body.classList.add('unlocked');
            }, 3500);
        };
    </script>

</body>
</html>
